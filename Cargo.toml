[package]
name = "folia-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1.7"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "MouseEvent",
  "InputEvent",
  "Event",
  "EventTarget",
  "Selection",
  "DomRect",
  "CssStyleDeclaration",
  "Node",
  "NodeList",
  "Navigator",
  "DomTokenList",
  "AddEventListenerOptions",
  "console",
]

[workspace]
members = ["src-tauri"]

# 发布档必须写在 workspace 根：写在成员 crate（src-tauri/Cargo.toml）里
# cargo 会直接忽略并警告 "profiles for the non root package will be ignored"。
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
